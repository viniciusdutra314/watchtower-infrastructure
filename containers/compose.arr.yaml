services:
    unmanic:
        container_name: unmanic
        image: josh5/unmanic:latest
        ports:
            - 8888:8888
        environment:
            - PUID=${PUID}
            - PGID=${PGID}
            - UMASK=022
        restart: on-failure
        volumes:
            - type: bind
              target: /config
              source: ${STATE_ROOT}/unmanic/config
              bind:
                  create_host_path: false
            - type: bind
              source: ${LIBRARY_ROOT}
              target: /old_hdd
              bind:
                  create_host_path: false
    prowlarr:
        image: lscr.io/linuxserver/prowlarr:latest
        container_name: prowlarr
        ports:
            - 9696:9696
        environment:
            - PUID=${PUID}
            - PGID=${PGID}
            - TZ=${TZ}
            - UMASK=022
        volumes:
            - type: bind
              source: ${STATE_ROOT}/prowlarr/
              target: /config
              bind:
                  create_host_path: false
        restart: on-failure

    flaresolverr:
        image: ghcr.io/flaresolverr/flaresolverr:latest
        container_name: flaresolverr
        environment:
            - LOG_LEVEL=${LOG_LEVEL:-info}
            - LOG_HTML=${LOG_HTML:-false}
            - CAPTCHA_SOLVER=${CAPTCHA_SOLVER:-none}
            - TZ=${TZ}
            - UMASK=022
        restart: on-failure

    qbittorrent:
        image: linuxserver/qbittorrent:latest
        container_name: qbittorrent
        restart: on-failure
        ports:
            - 8080:8080
        environment:
            - TZ=${TZ}
            - WEBUI_PORT=8080
            - TORRENTING_PORT=6881
            - PUID=${PUID}
            - PGID=${PGID}
            - UMASK=022
        volumes:
            - type: bind
              source: ${STATE_ROOT}/qbittorrent/config
              target: /config
              bind:
                  create_host_path: false
            - type: bind
              source: ${LIBRARY_ROOT}
              target: /old_hdd
              bind:
                  create_host_path: false
    jellyfin:
        image: linuxserver/jellyfin:latest
        restart: on-failure
        container_name: jellyfin
        environment:
            - TZ=${TZ}
            - PUID=${PUID}
            - PGID=${PGID}
            - UMASK=022
        volumes:
            - type: bind
              source: ${LIBRARY_ROOT}
              target: /old_hdd
              bind:
                  create_host_path: false
            - type: bind
              source: ${STATE_ROOT}/jellyfin/config
              target: /config
              bind:
                  create_host_path: false
        ports:
            - 8096:8096
    sonarr:
        image: lscr.io/linuxserver/sonarr:latest
        container_name: sonarr
        environment:
            - PUID=${PUID}
            - PGID=${PGID}
            - TZ=${TZ}
            - UMASK=022
        ports:
            - 8989:8989
        volumes:
            - type: bind
              source: ${STATE_ROOT}/sonarr
              target: /config
              bind:
                  create_host_path: false
            - type: bind
              source: ${LIBRARY_ROOT}
              target: /old_hdd
              bind:
                  create_host_path: false
        restart: on-failure

    radarr:
        image: lscr.io/linuxserver/radarr:latest
        container_name: radarr
        ports:
            - 7878:7878
        environment:
            - PUID=${PUID}
            - PGID=${PGID}
            - TZ=${TZ}
            - UMASK=022
        volumes:
            - type: bind
              source: ${STATE_ROOT}/radarr
              target: /config
              bind:
                  create_host_path: false
            - type: bind
              source: ${LIBRARY_ROOT}
              target: /old_hdd
              bind:
                  create_host_path: false
        restart: on-failure
    bazarr:
        image: lscr.io/linuxserver/bazarr:latest
        container_name: bazarr
        ports:
            - 6767:6767
        environment:
            - PUID=${PUID}
            - PGID=${PGID}
            - TZ=${TZ}
            - UMASK=022
        volumes:
            - type: bind
              source: ${STATE_ROOT}/bazarr
              target: /config
              bind:
                  create_host_path: false
            - type: bind
              source: ${LIBRARY_ROOT}
              target: /old_hdd
              bind:
                  create_host_path: false
        restart: on-failure
